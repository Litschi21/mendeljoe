# meson cross-file for building arm64 (aarch64) binaries for the Wombat.
#
# Applied automatically by scripts/build.sh when ARCH=arm64. Users do not need to
# touch this — change ARCH in config.env instead.
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'aarch64-linux-gnu-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
